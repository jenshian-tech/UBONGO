<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>烏邦果(Ubongo)線上互動版</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 與 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 引入 Babel 供瀏覽器直接編譯 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { 
            margin: 0; padding: 0; background-color: #f0f4f8; 
            overscroll-behavior: none; /* 防止手機預設滾動/重整 */
            touch-action: none; /* 防止預設觸控行為，確保拖曳順暢 */
        }
        /* 隱藏捲軸但保留功能 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        .grab-cursor { cursor: grab; }
        .grabbing-cursor { cursor: grabbing !important; }
        
        /* 防止選取文字與長按選單導致拖曳異常 */
        .no-select { 
            user-select: none; 
            -webkit-user-select: none; 
            -webkit-touch-callout: none;
        }

        /* 縮放容器過渡效果 */
        .zoom-container {
            transition: transform 0.1s ease-out;
            transform-origin: top center;
        }

        /* 動態提示文字動畫 */
        @keyframes float-up {
            0% { opacity: 0; transform: translateY(10px) translateX(-50%); }
            20% { opacity: 1; transform: translateY(0) translateX(-50%); }
            80% { opacity: 1; transform: translateY(0) translateX(-50%); }
            100% { opacity: 0; transform: translateY(-10px) translateX(-50%); }
        }
        .animate-float-up { animation: float-up 2s ease-in-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        // --- SVG 圖示元件 ---
        const IconPlay = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 9-14 9V3z"/></svg>;
        const IconClock = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
        const IconTrophy = () => <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7c0 6 6 10 6 10s6-4 6-10V2z"/></svg>;
        const IconAlert = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>;
        const IconRotateCW = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>;
        const IconRotateCCW = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>;
        const IconFlipH = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="8 3 8 21"/><polyline points="16 3 16 21"/><path d="M12 3v18"/></svg>;
        const IconVolume2 = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>;
        const IconVolumeX = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>;
        const IconZoomIn = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>;
        const IconZoomOut = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>;

        // --- 幾何常數與計算 ---
        const SHAPES = [
            [{x:0,y:0},{x:1,y:0},{x:2,y:0}], // I3 
            [{x:0,y:0},{x:1,y:0},{x:0,y:1}], // V3 
            [{x:0,y:0},{x:1,y:0},{x:0,y:1},{x:1,y:1}], // O4 
            [{x:0,y:0},{x:1,y:0},{x:2,y:0},{x:3,y:0}], // I4 
            [{x:1,y:0},{x:0,y:1},{x:1,y:1},{x:2,y:1}], // T4 
            [{x:0,y:0},{x:0,y:1},{x:1,y:1},{x:2,y:1}], // L4 
            [{x:2,y:0},{x:0,y:1},{x:1,y:1},{x:2,y:1}], // J4 
            [{x:1,y:0},{x:2,y:0},{x:0,y:1},{x:1,y:1}], // S4 
            [{x:0,y:0},{x:1,y:0},{x:1,y:1},{x:2,y:1}], // Z4 
        ];

        const GEM_TYPES = [
            { id: 'red', icon: '🔴', name: '紅寶石', value: 4 },
            { id: 'blue', icon: '🔵', name: '藍寶石', value: 3 },
            { id: 'green', icon: '🟢', name: '綠寶石', value: 2 },
            { id: 'yellow', icon: '🟡', name: '黃寶石', value: 1 }
        ];

        const getRandomGem = () => GEM_TYPES[Math.floor(Math.random() * GEM_TYPES.length)];
        const PIECE_COLORS = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];

        const normalizeShape = (shape) => {
            let minX = Math.min(...shape.map(p => p.x));
            let minY = Math.min(...shape.map(p => p.y));
            return shape.map(p => ({ x: p.x - minX, y: p.y - minY }));
        };

        const rotateShapeCW = (shape) => normalizeShape(shape.map(p => ({ x: -p.y, y: p.x })));
        const rotateShapeCCW = (shape) => normalizeShape(shape.map(p => ({ x: p.y, y: -p.x })));
        const flipShape = (shape) => normalizeShape(shape.map(p => ({ x: -p.x, y: p.y })));

        // 取得形狀幾何中心 (用來維持旋轉時的位置)
        const getShapeCenter = (shape) => {
            const minBx = Math.min(...shape.map(b => b.x));
            const maxBx = Math.max(...shape.map(b => b.x));
            const minBy = Math.min(...shape.map(b => b.y));
            const maxBy = Math.max(...shape.map(b => b.y));
            return {
                x: minBx + (maxBx - minBx) / 2,
                y: minBy + (maxBy - minBy) / 2
            };
        };

        // 隨機生成謎題
        const generatePuzzle = (numPieces) => {
            for (let attempts = 0; attempts < 500; attempts++) {
                let pool = [];
                for (let i = 0; i < numPieces; i++) {
                    pool.push([...SHAPES[Math.floor(Math.random() * SHAPES.length)]]);
                }
                
                let C = [...pool[0]];
                let piecesData = [{ id: 0, originalShape: pool[0] }];
                let success = true;

                for (let i = 1; i < numPieces; i++) {
                    let shape = pool[i];
                    for (let r = 0; r < Math.floor(Math.random() * 4); r++) shape = rotateShapeCW(shape);
                    if (Math.random() > 0.5) shape = flipShape(shape);

                    let validPlacements = [];
                    let minX = Math.min(...C.map(p => p.x)) - 3;
                    let maxX = Math.max(...C.map(p => p.x)) + 3;
                    let minY = Math.min(...C.map(p => p.y)) - 3;
                    let maxY = Math.max(...C.map(p => p.y)) + 3;

                    for (let dx = minX; dx <= maxX; dx++) {
                        for (let dy = minY; dy <= maxY; dy++) {
                            let overlap = false;
                            let adjacent = false;
                            for (let p of shape) {
                                let nx = p.x + dx;
                                let ny = p.y + dy;
                                if (C.some(cp => cp.x === nx && cp.y === ny)) {
                                    overlap = true; break;
                                }
                                if (C.some(cp => Math.abs(cp.x - nx) + Math.abs(cp.y - ny) === 1)) {
                                    adjacent = true;
                                }
                            }
                            if (!overlap && adjacent) {
                                let tempC = [...C, ...shape.map(p => ({ x: p.x + dx, y: p.y + dy }))];
                                let tMinX = Math.min(...tempC.map(p => p.x));
                                let tMaxX = Math.max(...tempC.map(p => p.x));
                                let tMinY = Math.min(...tempC.map(p => p.y));
                                let tMaxY = Math.max(...tempC.map(p => p.y));
                                if (tMaxX - tMinX < 8 && tMaxY - tMinY < 8) {
                                    validPlacements.push({ dx, dy });
                                }
                            }
                        }
                    }
                    if (validPlacements.length === 0) { success = false; break; }
                    let choice = validPlacements[Math.floor(Math.random() * validPlacements.length)];
                    let placedShape = shape.map(p => ({ x: p.x + choice.dx, y: p.y + choice.dy }));
                    C.push(...placedShape);
                    piecesData.push({ id: i, originalShape: pool[i] });
                }

                if (success) {
                    let normalizedC = normalizeShape(C);
                    let width = Math.max(...normalizedC.map(p => p.x)) + 1;
                    let height = Math.max(...normalizedC.map(p => p.y)) + 1;
                    let offsetX = Math.floor((8 - width) / 2);
                    let offsetY = Math.floor((8 - height) / 2);
                    let boardTargetBlocks = normalizedC.map(p => ({ x: p.x + offsetX, y: p.y + offsetY }));

                    let userPieces = piecesData.map((pd, idx) => ({
                        id: 'p' + idx,
                        shape: pd.originalShape,
                        color: PIECE_COLORS[idx % PIECE_COLORS.length],
                        isPlaced: false,
                        boardX: null,
                        boardY: null
                    }));
                    
                    userPieces.sort(() => Math.random() - 0.5);
                    return { targetBlocks: boardTargetBlocks, pieces: userPieces };
                }
            }
            // 萬一隨機失敗，提供預設謎題
            return {
                targetBlocks: [{x:3,y:3},{x:4,y:3},{x:3,y:4},{x:4,y:4}],
                pieces: [{id:'p0', shape:[{x:0,y:0},{x:1,y:0},{x:0,y:1},{x:1,y:1}], color:'#ef4444', isPlaced:false, boardX:null, boardY:null}]
            };
        };

        function App() {
            // --- 狀態管理 ---
            const [gameState, setGameState] = useState('START');
            const [round, setRound] = useState(1);
            const [score, setScore] = useState(0);
            const [gems, setGems] = useState([]); 
            const [timeLeft, setTimeLeft] = useState(60);
            const [hasStartedInteracting, setHasStartedInteracting] = useState(false);
            
            const [puzzle, setPuzzle] = useState(null);
            const [pieces, setPieces] = useState([]);
            const [selectedPieceId, setSelectedPieceId] = useState(null);
            const [roundRewards, setRoundRewards] = useState([]);
            const [errorMsg, setErrorMsg] = useState(null); // 錯誤提示文字

            const [soundEnabled, setSoundEnabled] = useState(false);
            const audioCtxRef = useRef(null);

            const [zoomLevel, setZoomLevel] = useState(1);
            const MAX_ZOOM = 1.5;
            const MIN_ZOOM = 0.5;

            const boardRef = useRef(null);
            const [dragState, setDragState] = useState(null); 

            // 響應式預設縮放
            useEffect(() => {
                if (window.innerWidth < 768) setZoomLevel(0.85); 
            }, []);

            // --- 音樂 ---
            useEffect(() => {
                if (!audioCtxRef.current) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) audioCtxRef.current = new AudioContext();
                }
                
                let interval;
                if (soundEnabled && audioCtxRef.current) {
                    if (audioCtxRef.current.state === 'suspended') audioCtxRef.current.resume();
                    const freqs = [196.00, 220.00, 261.63, 293.66, 329.63, 392.00]; 
                    interval = setInterval(() => {
                        if (['PLAYING', 'START', 'UBONGO_CALLED'].includes(gameState)) {
                            const ctx = audioCtxRef.current;
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.type = 'sine'; 
                            osc.frequency.value = freqs[Math.floor(Math.random() * freqs.length)];
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            const now = ctx.currentTime;
                            osc.start(now);
                            gain.gain.setValueAtTime(0, now);
                            gain.gain.linearRampToValueAtTime(0.02, now + 1); 
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 3); 
                            osc.stop(now + 3);
                        }
                    }, 1500); 
                }
                return () => { if (interval) clearInterval(interval); };
            }, [soundEnabled, gameState]);

            // --- 遊戲流程 ---
            const startRound = (r = round) => {
                const numPieces = r <= 3 ? 3 : 4; 
                const newPuzzle = generatePuzzle(numPieces);
                setPuzzle(newPuzzle);
                setPieces(newPuzzle.pieces);
                setSelectedPieceId(null);
                setRound(r);
                setTimeLeft(60);
                setHasStartedInteracting(false);
                setRoundRewards([]);
                setDragState(null);
                setErrorMsg(null);
                setGameState('PLAYING');
            };

            const resetGame = () => {
                setScore(0);
                setGems([]);
                startRound(1);
            };

            // 計時器
            useEffect(() => {
                if (gameState === 'PLAYING' && hasStartedInteracting && timeLeft > 0) {
                    const timer = setTimeout(() => setTimeLeft(prev => prev - 1), 1000);
                    return () => clearTimeout(timer);
                } else if (gameState === 'PLAYING' && hasStartedInteracting && timeLeft === 0) {
                    processRoundRewards(false);
                }
            }, [timeLeft, gameState, hasStartedInteracting]);

            // 勝利判定
            useEffect(() => {
                if (gameState !== 'PLAYING' || !puzzle) return;
                if (pieces.every(p => p.isPlaced)) {
                    const allPlacedBlocks = pieces.filter(p => p.isPlaced).flatMap(p => 
                        p.shape.map(b => ({ x: p.boardX + b.x, y: p.boardY + b.y }))
                    );
                    if (allPlacedBlocks.length === puzzle.targetBlocks.length) {
                        const isExactMatch = allPlacedBlocks.every(pb => 
                            puzzle.targetBlocks.some(tb => tb.x === pb.x && tb.y === pb.y)
                        );
                        if (isExactMatch) {
                            setGameState('UBONGO_CALLED');
                            setSelectedPieceId(null);
                        }
                    }
                }
            }, [pieces, puzzle, gameState]);

            // 短暫顯示錯誤訊息
            const showMsg = (msg) => {
                setErrorMsg(msg);
                setTimeout(() => setErrorMsg(null), 2000);
            };

            // --- 拖曳邏輯 ---
            const handleDragStart = (e, piece) => {
                if (gameState !== 'PLAYING') return;
                if (e.touches && e.touches.length > 1) return; // 忽略多指操作

                setHasStartedInteracting(true);
                setSelectedPieceId(piece.id); 

                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                setDragState({
                    pieceId: piece.id,
                    startX: clientX,
                    startY: clientY,
                    currentX: clientX,
                    currentY: clientY,
                    deltaX: 0,
                    deltaY: 0,
                    hasMoved: false // 區分點擊與拖曳
                });
            };

            const handleDragMove = useCallback((e) => {
                if (!dragState || gameState !== 'PLAYING') return;
                if (e.cancelable) e.preventDefault(); 

                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                // 超過 5px 算作拖曳
                const dist = Math.sqrt(Math.pow(clientX - dragState.startX, 2) + Math.pow(clientY - dragState.startY, 2));

                setDragState(prev => ({
                    ...prev,
                    currentX: clientX,
                    currentY: clientY,
                    deltaX: (clientX - prev.startX) / zoomLevel,
                    deltaY: (clientY - prev.startY) / zoomLevel,
                    hasMoved: prev.hasMoved || dist > 5 
                }));
                
                // 拖曳開始，暫時將積木從圖板拔起
                if (dist > 5) {
                    const piece = pieces.find(p => p.id === dragState.pieceId);
                    if (piece && piece.isPlaced) {
                        setPieces(prev => prev.map(p => p.id === piece.id ? { ...p, isPlaced: false } : p));
                    }
                }

            }, [dragState, gameState, zoomLevel, pieces]);

            const handleDragEnd = useCallback((e) => {
                if (!dragState || gameState !== 'PLAYING') return;

                const { pieceId, hasMoved } = dragState;
                const piece = pieces.find(p => p.id === pieceId);
                
                // 單純點擊 -> 保留原本狀態，不處理吸附
                if (!hasMoved) {
                    setDragState(null);
                    return;
                }

                let finalX = piece.boardX;
                let finalY = piece.boardY;
                let isPlaced = false;

                if (boardRef.current) {
                    const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
                    const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
                    
                    const rect = boardRef.current.getBoundingClientRect();
                    const actualCellSize = rect.width / 8;
                    const buffer = actualCellSize * 0.5;
                    
                    if (clientX >= rect.left - buffer && clientX <= rect.right + buffer &&
                        clientY >= rect.top - buffer && clientY <= rect.bottom + buffer) {
                        
                        const boardHoverX = Math.floor((clientX - rect.left) / actualCellSize);
                        const boardHoverY = Math.floor((clientY - rect.top) / actualCellSize);
                        
                        const center = getShapeCenter(piece.shape);
                        let targetBoardX = boardHoverX - Math.floor(center.x);
                        let targetBoardY = boardHoverY - Math.floor(center.y);

                        // 邊界檢查
                        const isOutOfBounds = piece.shape.some(b => {
                            const bx = targetBoardX + b.x;
                            const by = targetBoardY + b.y;
                            return bx < 0 || bx >= 8 || by < 0 || by >= 8;
                        });

                        // 重疊檢查
                        const hasOverlap = pieces.filter(p => p.isPlaced && p.id !== piece.id).some(placedPiece => {
                            return placedPiece.shape.some(pb => {
                                const px = placedPiece.boardX + pb.x;
                                const py = placedPiece.boardY + pb.y;
                                return piece.shape.some(b => b.x + targetBoardX === px && b.y + targetBoardY === py);
                            });
                        });

                        if (!isOutOfBounds && !hasOverlap) {
                            finalX = targetBoardX;
                            finalY = targetBoardY;
                            isPlaced = true;
                        } else {
                            finalX = null;
                            finalY = null;
                            if (isOutOfBounds) showMsg('超出邊界！');
                            else if (hasOverlap) showMsg('積木重疊！');
                        }
                    } else {
                        // 圖板外放回托盤
                        finalX = null;
                        finalY = null;
                    }
                }

                setPieces(prev => prev.map(p => 
                    p.id === pieceId ? { ...p, isPlaced, boardX: finalX, boardY: finalY } : p
                ));

                setDragState(null);
            }, [dragState, gameState, pieces]);

            useEffect(() => {
                if (dragState) {
                    window.addEventListener('mousemove', handleDragMove, { passive: false });
                    window.addEventListener('mouseup', handleDragEnd);
                    window.addEventListener('touchmove', handleDragMove, { passive: false });
                    window.addEventListener('touchend', handleDragEnd);
                }
                return () => {
                    window.removeEventListener('mousemove', handleDragMove);
                    window.removeEventListener('mouseup', handleDragEnd);
                    window.removeEventListener('touchmove', handleDragMove);
                    window.removeEventListener('touchend', handleDragEnd);
                };
            }, [dragState, handleDragMove, handleDragEnd]);


            // --- 控制功能 (旋轉與翻轉) ---
            const handleTransform = (transformFn, pieceId) => {
                setHasStartedInteracting(true);
                const piece = pieces.find(p => p.id === pieceId);
                const newShape = transformFn(piece.shape);

                if (piece.isPlaced) {
                    const oldCenter = getShapeCenter(piece.shape);
                    const newCenter = getShapeCenter(newShape);
                    
                    let newBoardX = piece.boardX + Math.floor(oldCenter.x - newCenter.x);
                    let newBoardY = piece.boardY + Math.floor(oldCenter.y - newCenter.y);

                    const isOutOfBounds = newShape.some(b => {
                        const bx = newBoardX + b.x;
                        const by = newBoardY + b.y;
                        return bx < 0 || bx >= 8 || by < 0 || by >= 8;
                    });

                    const hasOverlap = pieces.filter(p => p.isPlaced && p.id !== piece.id).some(placedPiece => {
                        return placedPiece.shape.some(pb => {
                            const px = placedPiece.boardX + pb.x;
                            const py = placedPiece.boardY + pb.y;
                            return newShape.some(b => b.x + newBoardX === px && b.y + newBoardY === py);
                        });
                    });

                    if (isOutOfBounds || hasOverlap) {
                        showMsg('旋轉空間不足！');
                        return; 
                    }

                    setPieces(prev => prev.map(p => p.id === pieceId ? { ...p, shape: newShape, boardX: newBoardX, boardY: newBoardY } : p));
                } else {
                    setPieces(prev => prev.map(p => p.id === pieceId ? { ...p, shape: newShape } : p));
                }
            };

            const processRoundRewards = (finishedSuccess) => {
                let earned = [];
                const timeTaken = 60 - timeLeft;
                if (finishedSuccess) {
                    if (timeTaken <= 20) { earned.push(GEM_TYPES.find(g => g.id === 'blue')); earned.push(getRandomGem()); } 
                    else if (timeTaken <= 40) { earned.push(GEM_TYPES.find(g => g.id === 'yellow')); earned.push(getRandomGem()); } 
                    else { earned.push(getRandomGem()); }
                }
                setRoundRewards(earned);
                setGems(prev => [...prev, ...earned]);
                setScore(prev => prev + earned.reduce((sum, g) => sum + g.value, 0));
                setGameState('ROUND_OVER');
            };

            // --- 渲染組件 ---
            
            // 懸浮控制面板改為渲染函數，避免重新掛載導致按鈕點擊失效
            const renderActionPanel = (piece) => {
                if (!piece || gameState !== 'PLAYING') return null;
                if (dragState && dragState.pieceId === piece.id && dragState.hasMoved) return null; // 拖曳中隱藏

                let positionClass = "top-full left-1/2 -translate-x-1/2 mt-3"; 
                if (piece.isPlaced && piece.boardY > 4) {
                    positionClass = "bottom-full left-1/2 -translate-x-1/2 mb-3";
                }

                return (
                    <div 
                        className={`absolute ${positionClass} bg-white/95 backdrop-blur rounded-xl shadow-[0_10px_25px_rgba(0,0,0,0.15)] border border-gray-200 p-1.5 flex gap-1 z-[100] animate-in zoom-in duration-200`}
                        onMouseDown={(e) => e.stopPropagation()}
                        onTouchStart={(e) => e.stopPropagation()}
                        onClick={(e) => e.stopPropagation()}
                    >
                        <button onClick={(e) => { e.stopPropagation(); handleTransform(rotateShapeCCW, piece.id); }} className="p-3 bg-gray-50 text-blue-600 rounded-lg hover:bg-blue-100 active:bg-blue-200" title="逆時針旋轉"><IconRotateCCW /></button>
                        <button onClick={(e) => { e.stopPropagation(); handleTransform(rotateShapeCW, piece.id); }} className="p-3 bg-gray-50 text-blue-600 rounded-lg hover:bg-blue-100 active:bg-blue-200" title="順時針旋轉"><IconRotateCW /></button>
                        <div className="w-px bg-gray-200 my-1 mx-0.5"></div>
                        <button onClick={(e) => { e.stopPropagation(); handleTransform(flipShape, piece.id); }} className="p-3 bg-gray-50 text-purple-600 rounded-lg hover:bg-purple-100 active:bg-purple-200" title="水平翻轉"><IconFlipH /></button>
                    </div>
                );
            }

            const renderBoard = () => {
                if (!puzzle) return null;
                return (
                    <div ref={boardRef} className="relative w-full max-w-[400px] mx-auto aspect-square bg-[#faeed8] border-[10px] border-[#7a4b2c] rounded shadow-2xl overflow-hidden no-select">
                        <div className="absolute inset-0 grid grid-cols-8 grid-rows-8">
                            {Array.from({length: 64}).map((_, i) => <div key={i} className="border border-[#dcb892] opacity-40 pointer-events-none" />)}
                        </div>
                        {puzzle.targetBlocks.map((tb, i) => (
                            <div key={'t'+i} className="absolute bg-[#ffffff] border border-gray-200 shadow-[inset_0_2px_8px_rgba(0,0,0,0.05)] pointer-events-none" style={{ left: `${tb.x * 12.5}%`, top: `${tb.y * 12.5}%`, width: '12.5%', height: '12.5%' }}/>
                        ))}
                        
                        {/* 渲染放置在圖板上的積木 */}
                        {pieces.filter(p => p.isPlaced && (!dragState || dragState.pieceId !== p.id || !dragState.hasMoved)).map(piece => {
                            const isSelected = selectedPieceId === piece.id;
                            return (
                                <div 
                                    key={piece.id} 
                                    className={`absolute ${gameState === 'PLAYING' ? 'grab-cursor hover:scale-[1.02]' : ''} transition-transform ${isSelected ? 'z-50' : 'z-20'}`} 
                                    style={{ left: `${piece.boardX * 12.5}%`, top: `${piece.boardY * 12.5}%`, width: '12.5%', height: '12.5%' }}
                                    onMouseDown={(e) => handleDragStart(e, piece)}
                                    onTouchStart={(e) => handleDragStart(e, piece)}
                                    onClick={(e) => {
                                        if(gameState === 'PLAYING') {
                                            e.stopPropagation();
                                            setHasStartedInteracting(true);
                                            setSelectedPieceId(isSelected ? null : piece.id);
                                        }
                                    }}
                                >
                                    {piece.shape.map((b, bi) => (
                                        <div key={bi} className={`absolute border-[3px] border-black/20 shadow-sm rounded-sm ${isSelected ? 'ring-2 ring-yellow-400 ring-offset-1' : ''}`} style={{ left: `${b.x * 100}%`, top: `${b.y * 100}%`, width: '100%', height: '100%', backgroundColor: piece.color }}/>
                                    ))}
                                    {isSelected && renderActionPanel(piece)}
                                </div>
                            );
                        })}

                        {/* 錯誤提示氣泡 */}
                        {errorMsg && (
                            <div key={errorMsg} className="absolute top-1/2 left-1/2 z-[200] font-bold text-lg text-white bg-red-600/90 px-4 py-2 rounded-full shadow-lg pointer-events-none animate-float-up backdrop-blur-sm whitespace-nowrap">
                                ⚠️ {errorMsg}
                            </div>
                        )}

                        {gameState === 'UBONGO_CALLED' && (
                            <div className="absolute inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center">
                                <button onClick={() => processRoundRewards(true)} className="bg-yellow-400 text-red-700 border-4 border-white font-black text-4xl py-4 px-8 rounded-full shadow-[0_0_40px_rgba(250,204,21,0.6)] animate-bounce hover:scale-105 transition-transform">烏邦果！</button>
                            </div>
                        )}
                    </div>
                );
            };

            const renderDragGhost = () => {
                if (!dragState || !dragState.hasMoved) return null;
                const { pieceId, currentX, currentY } = dragState;
                const piece = pieces.find(p => p.id === pieceId);
                if (!piece) return null;

                let blockSize = 40; 
                if (boardRef.current) blockSize = (boardRef.current.getBoundingClientRect().width / 8) / zoomLevel;

                let minBx = Math.min(...piece.shape.map(b=>b.x));
                let minBy = Math.min(...piece.shape.map(b=>b.y));
                let maxBx = Math.max(...piece.shape.map(b=>b.x));
                let maxBy = Math.max(...piece.shape.map(b=>b.y));
                let w = (maxBx - minBx + 1) * blockSize;
                let h = (maxBy - minBy + 1) * blockSize;

                return (
                    <div className="fixed z-[9999] pointer-events-none grabbing-cursor" style={{ left: currentX, top: currentY, transform: `translate(-50%, -50%) scale(${zoomLevel})`, transformOrigin: 'center' }}>
                        <div className="relative" style={{ width: w, height: h }}>
                            {piece.shape.map((b, bi) => (
                                <div key={bi} className="absolute border-[3px] border-black/40 shadow-2xl rounded-sm opacity-90" style={{ left: (b.x - minBx) * blockSize, top: (b.y - minBy) * blockSize, width: blockSize, height: blockSize, backgroundColor: piece.color }}/>
                            ))}
                        </div>
                    </div>
                );
            };

            return (
                <div className={`min-h-[100dvh] flex flex-col font-sans relative overflow-hidden ${dragState?.hasMoved ? 'grabbing-cursor' : ''}`}>
                    <div className="absolute top-4 right-4 z-50">
                        <button onClick={() => setSoundEnabled(!soundEnabled)} className="bg-white/80 backdrop-blur p-3 rounded-full shadow-md text-gray-600 hover:text-blue-600 transition-colors">
                            {soundEnabled ? <IconVolume2 /> : <IconVolumeX />}
                        </button>
                    </div>

                    {gameState === 'START' && (
                        <div className="flex-1 flex items-center justify-center p-4">
                            <div className="w-full max-w-md bg-white p-6 md:p-8 rounded-3xl shadow-xl text-center border-t-8 border-yellow-400 no-select">
                                <h1 className="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-br from-red-600 via-orange-500 to-yellow-500 mb-2">烏邦果</h1>
                                <p className="text-gray-500 font-bold mb-8 text-xl tracking-widest">Ubongo</p>
                                <div className="bg-blue-50 text-left p-6 rounded-2xl mb-8 space-y-3">
                                    <h3 className="font-bold flex items-center gap-2 text-blue-800 border-b border-blue-200 pb-2"><IconAlert /> 遊戲規則</h3>
                                    <p className="text-sm text-gray-700">1. 在限制時間內，將下方積木 <b>拖曳</b> 到圖板填滿白色區塊。</p>
                                    <p className="text-sm text-gray-700">2. <span className="font-bold text-blue-700">點擊積木</span> 可在原地喚出 <b>旋轉/翻轉面板</b>。</p>
                                    <p className="text-sm text-gray-700">3. 若畫面太小，可使用底部滑桿調整。</p>
                                    <p className="text-sm text-red-600 font-bold mt-2">★ 計時器將在你第一次觸碰拼圖時才會啟動。</p>
                                </div>
                                <button onClick={() => startRound(1)} className="w-full py-4 bg-green-500 hover:bg-green-600 text-white font-bold rounded-2xl text-xl shadow-lg shadow-green-200 transition-all active:scale-95 flex items-center justify-center gap-2">
                                    <IconPlay /> 開始遊戲
                                </button>
                            </div>
                        </div>
                    )}

                    {(gameState === 'PLAYING' || gameState === 'UBONGO_CALLED') && (
                        <>
                            <div className="flex-1 overflow-auto p-4 md:p-8 pb-32" onClick={() => setSelectedPieceId(null)}>
                                <div className="max-w-5xl mx-auto flex flex-col h-full zoom-container" style={{ transform: `scale(${zoomLevel})` }}>
                                    
                                    {/* 頂部計分板 */}
                                    <div className="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-6 no-select relative z-10" onClick={e=>e.stopPropagation()}>
                                        <div className="flex flex-col"><span className="text-gray-500 text-xs md:text-sm font-bold tracking-wider">回合 ROUND</span><span className="text-xl md:text-2xl font-extrabold text-blue-900">{round} / 9</span></div>
                                        <div className="flex flex-col items-center">
                                            <div className="text-gray-500 text-xs md:text-sm font-bold flex items-center gap-1"><IconClock /> 剩餘時間</div>
                                            <div className={`text-2xl md:text-3xl font-black ${timeLeft <= 10 ? 'text-red-500 animate-pulse' : 'text-gray-800'}`}>{hasStartedInteracting ? `${timeLeft}s` : <span className="text-gray-400 text-lg md:text-2xl">等待操作</span>}</div>
                                        </div>
                                        <div className="flex flex-col text-right"><span className="text-gray-500 text-xs md:text-sm font-bold">總分 SCORE</span><span className="text-xl md:text-2xl font-extrabold text-green-600">{score} 💎</span></div>
                                    </div>
                                    
                                    <div className="flex flex-col lg:flex-row gap-6 md:gap-8 flex-1">
                                        <div className="w-full lg:w-3/5 flex justify-center items-start" onClick={e=>e.stopPropagation()}>
                                            {renderBoard()}
                                        </div>
                                        
                                        <div className="w-full lg:w-2/5 bg-white p-4 md:p-6 rounded-3xl shadow-sm border border-gray-200 flex flex-col no-select relative z-10 mt-6 lg:mt-0" onClick={e=>e.stopPropagation()}>
                                            <div className="flex justify-between items-center mb-4">
                                                <h3 className="text-gray-500 font-bold text-sm md:text-base">拼圖托盤</h3>
                                                <span className="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded-full font-bold">點擊旋轉 / 拖曳放置</span>
                                            </div>
                                            <div className="flex flex-wrap justify-center gap-x-8 gap-y-16 flex-1 items-start content-start min-h-[220px] bg-gray-50 rounded-2xl p-6 border-2 border-dashed border-gray-200">
                                                {pieces.filter(p => !p.isPlaced && (!dragState || dragState.pieceId !== p.id || !dragState.hasMoved)).map(piece => {
                                                    const isSelected = selectedPieceId === piece.id;
                                                    const blockSize = 35; 
                                                    const w = (Math.max(...piece.shape.map(b => b.x)) + 1) * blockSize;
                                                    const h = (Math.max(...piece.shape.map(b => b.y)) + 1) * blockSize;
                                                    return (
                                                        <div 
                                                            key={piece.id} 
                                                            className={`relative ${gameState === 'PLAYING' ? 'grab-cursor' : ''} ${isSelected ? 'z-50' : 'z-20'}`}
                                                            style={{ width: w, height: h }}
                                                            onClick={(e) => {
                                                                if(gameState === 'PLAYING') {
                                                                    e.stopPropagation();
                                                                    setHasStartedInteracting(true);
                                                                    setSelectedPieceId(isSelected ? null : piece.id);
                                                                }
                                                            }}
                                                            onMouseDown={(e) => handleDragStart(e, piece)}
                                                            onTouchStart={(e) => handleDragStart(e, piece)}
                                                        >
                                                            <div className={`relative transition-all duration-200 ${isSelected ? 'scale-110 drop-shadow-lg' : 'hover:scale-105'}`}>
                                                                {piece.shape.map((b, bi) => (
                                                                    <div key={bi} className={`absolute border-2 border-white shadow-sm rounded-sm ${isSelected ? 'ring-2 ring-yellow-400 ring-offset-1' : ''}`} style={{ left: b.x * blockSize, top: b.y * blockSize, width: blockSize, height: blockSize, backgroundColor: piece.color }}/>
                                                                ))}
                                                            </div>
                                                            {isSelected && renderActionPanel(piece)}
                                                        </div>
                                                    )
                                                })}
                                                {pieces.filter(p => !p.isPlaced).length === 0 && (!dragState || !dragState.hasMoved) && (
                                                    <div className="w-full h-full min-h-[100px] flex items-center justify-center text-gray-300 font-bold text-lg">拼圖已全數移出</div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* 縮放滑桿 */}
                            <div className="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-gray-200 p-4 pb-safe flex justify-center items-center z-[100] shadow-[0_-10px_20px_rgba(0,0,0,0.05)] no-select">
                                <div className="flex items-center gap-4 w-full max-w-md">
                                    <button className="text-gray-500 hover:text-blue-600 p-2" onClick={() => setZoomLevel(prev => Math.max(MIN_ZOOM, prev - 0.1))}><IconZoomOut /></button>
                                    <input type="range" min={MIN_ZOOM} max={MAX_ZOOM} step="0.05" value={zoomLevel} onChange={(e) => setZoomLevel(parseFloat(e.target.value))} className="flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-500"/>
                                    <button className="text-gray-500 hover:text-blue-600 p-2" onClick={() => setZoomLevel(prev => Math.min(MAX_ZOOM, prev + 0.1))}><IconZoomIn /></button>
                                </div>
                            </div>
                        </>
                    )}

                    {gameState === 'ROUND_OVER' && (
                        <div className="flex-1 flex items-center justify-center p-4">
                            <div className="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl text-center border-t-8 border-blue-400 animate-in slide-in-from-bottom-8 no-select">
                                <h2 className="text-3xl font-black text-gray-800 mb-6">回合結束！</h2>
                                <div className="bg-gray-50 rounded-2xl p-6 mb-8">
                                    <p className="text-gray-500 font-bold mb-2">花費時間</p>
                                    <p className={`text-4xl font-black ${timeLeft > 0 ? 'text-green-600' : 'text-red-500'} mb-6`}>{60 - timeLeft} 秒</p>
                                    <p className="text-gray-500 font-bold mb-2">獲得獎勵</p>
                                    {roundRewards.length > 0 ? (
                                        <div className="flex justify-center gap-4 text-4xl">
                                            {roundRewards.map((g, i) => <div key={i} className="animate-bounce drop-shadow-md" style={{animationDelay: `${i * 0.15}s`}}>{g.icon}</div>)}
                                        </div>
                                    ) : <p className="text-xl text-gray-400 font-bold mt-2">未獲得寶石 😢</p>}
                                </div>
                                <button onClick={() => round < 9 ? startRound(round + 1) : setGameState('GAME_OVER')} className="w-full py-4 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-2xl text-xl shadow-lg transition-all active:scale-95">
                                    {round < 9 ? `進入第 ${round + 1} 回合` : '查看最終成績'}
                                </button>
                            </div>
                        </div>
                    )}

                    {gameState === 'GAME_OVER' && (
                        <div className="flex-1 flex items-center justify-center p-4">
                            <div className="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl text-center border-t-8 border-yellow-400 animate-in zoom-in no-select">
                                <div className="flex justify-center mb-4 text-yellow-400 drop-shadow-md"><IconTrophy /></div>
                                <h2 className="text-4xl font-black text-gray-800 mb-2">遊戲完成！</h2>
                                <p className="text-gray-500 font-bold mb-8">經過了 9 回合的激烈挑戰</p>
                                <div className="bg-gradient-to-b from-yellow-50 to-white rounded-3xl p-6 border border-yellow-200 mb-8 shadow-inner">
                                    <p className="text-sm text-yellow-700 font-bold mb-1">最終總分</p>
                                    <p className="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-br from-yellow-500 to-orange-600 mb-6 drop-shadow-sm">{score}</p>
                                    <p className="text-sm text-gray-500 font-bold mb-3 border-t border-gray-100 pt-4">收集到的寶石清單</p>
                                    <div className="flex justify-center gap-6 text-2xl">
                                        {GEM_TYPES.map(g => (
                                            <span key={g.id} className="flex flex-col items-center">{g.icon}<span className="text-sm font-bold text-gray-700 mt-1">{gems.filter(gem=>gem.id===g.id).length}</span></span>
                                        ))}
                                    </div>
                                </div>
                                <button onClick={resetGame} className="w-full py-4 bg-gray-800 hover:bg-black text-white font-bold rounded-2xl text-xl shadow-xl transition-all active:scale-95">再來一局</button>
                            </div>
                        </div>
                    )}
                    {renderDragGhost()}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
